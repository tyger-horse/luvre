# £UVR€ — free staging on Render (M6 companion to the production compose stack).
#
# STAGING ONLY, on purpose:
#  - the free web service SLEEPS when idle (first visitor waits ~a minute,
#    and a buyer returning from PayPal lands on a cold app);
#  - the free database is time-limited — check Render's current terms;
#  - there is NO persistent disk, so uploaded plates VANISH on redeploy.
# When the first piece sells, move to deploy/docker-compose.yml on a VPS.
#
# Deploy: Render dashboard → New → Blueprint → point at this repo.
# Then set INTERAC_TRANSFER_EMAIL in the dashboard (sync: false below).

services:
  - type: web
    name: luvre
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: staging
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: luvre-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: luvre
          property: host
      - key: ORDER_TTL_HOURS
        value: 48
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: CRYPTO_PROVIDER
        value: coinbase
      - key: COINBASE_API_KEY
        sync: false
      - key: COINBASE_WEBHOOK_SECRET
        sync: false
      - key: INTERAC_TRANSFER_EMAIL
        sync: false
      - key: CRYPTO_ETH_ADDRESS
        sync: false
      - key: CRYPTO_BTC_ADDRESS
        sync: false
      - key: CRYPTO_USDC_ADDRESS
        sync: false

databases:
  - name: luvre-db
    plan: free
